name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC: catches advisories published after the last push
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    # Required: blocks high/critical advisories in what ships to visitors.
    name: npm audit (production deps)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:deps

  osv-scanner:
    # Report-only: lists advisories in every dependency, dev tooling included.
    name: OSV vulnerability scan
    runs-on: ubuntu-24.04
    env:
      OSV_VERSION: 2.7.1
    steps:
      - uses: actions/checkout@v7
      - name: Install osv-scanner
        run: |
          curl -fsSL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
      - name: Scan package-lock.json
        run: osv-scanner scan --lockfile=package-lock.json || true

  gitleaks:
    # Required: fails if a secret (token, key, password) is committed anywhere in the history.
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan the repository history
        run: gitleaks detect --redact --no-banner --verbose --exit-code 1
