name: CI

# Every job below is a required status check on `main` (see .github/rulesets/protect-main.json).
# Job names are what the ruleset matches: rename a job and the ruleset must be updated too.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '1'

jobs:
  lint:
    name: Lint & static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # typecheck, ESLint (0 warnings), Prettier, markdownlint, knip, unused assets,
      # licences, releases.json schema, unit tests of the scripts
      - run: npm run check

  build:
    name: Build (production)
    runs-on: ubuntu-24.04
    outputs:
      playwright: ${{ steps.versions.outputs.playwright }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: versions
        name: Read the Playwright version (selects the browser container below)
        run: echo "playwright=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          # authenticated call to the GitHub Releases API (avoids the anonymous rate limit)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build output sanity
        run: |
          for f in out/index.html out/en/index.html out/404.html out/sitemap.xml out/robots.txt; do
            test -f "$f" || { echo "::error::$f is missing from the export"; exit 1; }
          done
          echo "HTML pages: $(find out -name '*.html' | wc -l)"

      - name: Internal links
        run: npm run check:links

      - name: Bundle size limits
        run: npm run size

      - uses: actions/upload-artifact@v7
        with:
          name: out
          path: out
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: Playwright e2e
    needs: build
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright }}-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out
      - name: Run end-to-end tests (accessibility runs in its own job)
        run: npx playwright test --grep-invert "a11y:"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  a11y:
    name: Accessibility (axe)
    needs: build
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright }}-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out
      - run: npm run test:a11y
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out
      - run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2
